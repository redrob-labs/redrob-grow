[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/redrob-labs/redrob-grow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
grow-recipe = { path = "crates/recipe" }
grow-hal = { path = "crates/hal" }
grow-safety = { path = "crates/safety" }
grow-agent = { path = "crates/agent" }
grow-run = { path = "crates/run" }
# The shared Redrob Code daemon's run record and headers. Pinned to the engine tag the node targets.
redrob-engine-client = { git = "https://github.com/redrob-labs/redrob-code", tag = "v0.6.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
